apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opendb-operator
  namespace: opendb-system
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - db.opendb.dev
    resources:
      - opendbclusters
      - opendbclusters/status
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opendb-operator
  namespace: opendb-system
subjects:
  - kind: ServiceAccount
    name: opendb-operator
    namespace: opendb-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opendb-operator
